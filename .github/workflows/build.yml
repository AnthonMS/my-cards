name: Build
on:
    pull_request:
    push:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
            - name: Install
              run: npm ci
            - name: Build
              run: npm run build
            - name: Test
              # --if-present: main doesn't have the test harness until the next
              # release merge; runs the suite wherever the script exists
              run: npm run test --if-present
